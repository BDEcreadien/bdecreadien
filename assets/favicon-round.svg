<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="round"><circle cx="50" cy="50" r="50"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#463A90"/>
      <stop offset=".55" stop-color="#8B1A6B"/>
      <stop offset="1" stop-color="#E85100"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#round)">
    <rect width="100" height="100" fill="url(#bg)"/>
    <image href="/assets/icon-192.png" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid slice"/>
  </g>
</svg>
