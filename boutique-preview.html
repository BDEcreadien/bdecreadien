<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique BDE CREAD Lyon — Bientôt</title>
  <link rel="icon" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Bebas+Neue&display=swap">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#0a0015;font-family:'Barlow Condensed',sans-serif;color:white;overflow:hidden}
    .hero{
      position:relative;min-height:100vh;
      display:flex;align-items:center;justify-content:center;
      overflow:hidden;background:#0d001a;
    }
    /* Blobs */
    .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.6;animation:float linear infinite;}
    .blob1{width:420px;height:420px;background:#460186;top:-10%;left:-8%;animation-duration:22s;}
    .blob2{width:320px;height:320px;background:#D2396D;bottom:5%;right:-5%;animation-duration:28s;}
    .blob3{width:260px;height:260px;background:#FF741F;bottom:15%;left:20%;animation-duration:19s;}
    @keyframes float{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.05)}100%{transform:translateY(0) scale(1)}}
    .content{
      position:relative;z-index:1;
      text-align:center;padding:0 24px;
      display:flex;flex-direction:column;align-items:center;gap:0;
    }
    .pretitle{
      font-size:13px;letter-spacing:4px;text-transform:uppercase;
      color:rgba(255,255,255,.45);margin-bottom:16px;
    }
    .title{
      font-family:'Slovia','Bebas Neue',sans-serif;
      font-size:clamp(70px,15vw,160px);
      line-height:.9;letter-spacing:3px;
      color:transparent;
      background:linear-gradient(135deg,#fff 0%,#e8c0ff 30%,#ffaad0 60%,#ff9060 100%);
      -webkit-background-clip:text;background-clip:text;
      margin-bottom:16px;
    }
    .sub{font-size:18px;font-weight:600;color:rgba(255,255,255,.6);margin-bottom:36px;}
    .cd-label{font-size:13px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:18px;}
    .cd-row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;}
    .cd-box{
      background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
      border-radius:14px;padding:16px 20px;min-width:72px;text-align:center;
    }
    .cd-num{display:block;font-family:'Bebas Neue',sans-serif;font-size:42px;line-height:1;color:white;}
    .cd-lbl{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.4);margin-top:4px;}
    .cd-date{font-size:12px;letter-spacing:1px;color:rgba(255,255,255,.25);margin-top:14px;}
    .open-msg{
      display:none;
      font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:3px;
      background:linear-gradient(135deg,#4ade80,#10b981);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      margin-bottom:8px;
    }
    .open-link{
      display:none;
      margin-top:16px;
      font-size:16px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
      color:white;text-decoration:none;
      background:linear-gradient(135deg,#460186,#D2396D,#FF741F);
      padding:14px 36px;border-radius:14px;
    }
    @media(max-width:480px){
      .cd-box{min-width:60px;padding:12px 14px;}
      .cd-num{font-size:32px;}
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
    <div class="content">
      <p class="pretitle">BDE CREAD LYON · 2026-2027</p>
      <h1 class="title">BOUTIQUE</h1>
      <p class="sub">Merch officiel · Livraison à l'école</p>
      <p class="cd-label" id="cd-label">Ouverture dans</p>
      <div class="cd-row" id="cd-row"></div>
      <p class="cd-date" id="cd-date">Samedi 7 novembre à 12h00</p>
      <p class="open-msg" id="open-msg">La boutique est ouverte !</p>
      <a href="/boutique.html" class="open-link" id="open-link">Commander →</a>
    </div>
  </section>

  <script>
  (function(){
    const OPEN = new Date('2026-11-07T12:00:00+01:00');
    function pad(n){return String(n).padStart(2,'0')}
    const row   = document.getElementById('cd-row');
    const label = document.getElementById('cd-label');
    const date  = document.getElementById('cd-date');
    const msg   = document.getElementById('open-msg');
    const link  = document.getElementById('open-link');

    function tick(){
      const diff = OPEN - Date.now();
      if(diff <= 0){
        row.style.display   = 'none';
        label.style.display = 'none';
        date.style.display  = 'none';
        msg.style.display   = 'block';
        link.style.display  = 'inline-block';
        return;
      }
      const j = Math.floor(diff/86400000);
      const h = Math.floor((diff%86400000)/3600000);
      const m = Math.floor((diff%3600000)/60000);
      const s = Math.floor((diff%60000)/1000);
      row.innerHTML = [
        [j, j>1?'Jours':'Jour'],
        [pad(h),'Heures'],
        [pad(m),'Minutes'],
        [pad(s),'Secondes']
      ].map(([v,l])=>`<div class="cd-box"><span class="cd-num">${v}</span><span class="cd-lbl">${l}</span></div>`).join('');
    }
    tick();
    setInterval(tick,1000);
  })();
  </script>
</body>
</html>
