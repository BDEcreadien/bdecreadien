<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tirage au sort — BDE CREAD</title>
  <link rel="icon" href="/favicon-v2.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    :root {
      --bg:     #07070f;
      --v1:     #6D28D9;
      --v2:     #A855F7;
      --p1:     #EC4899;
      --gold:   #FBBF24;
      --gold2:  #F97316;
      --text:   #F4F4FA;
      --muted:  rgba(244,244,250,.4);
      --border: rgba(255,255,255,.07);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(109,40,217,.22) 0%, transparent 65%);
      top: -150px; left: -150px;
      animation: drift1 10s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 480px; height: 480px;
      background: radial-gradient(circle, rgba(236,72,153,.14) 0%, transparent 65%);
      bottom: -80px; right: -80px;
      animation: drift2 12s ease-in-out infinite alternate;
    }
    .orb-3 {
      width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(251,191,36,.08) 0%, transparent 65%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: drift1 8s ease-in-out infinite alternate;
    }
    @keyframes drift1 {
      from { transform: translate(0,0); }
      to   { transform: translate(50px,40px); }
    }
    @keyframes drift2 {
      from { transform: translate(0,0); }
      to   { transform: translate(-40px,-30px); }
    }

    /* Stats */
    .stats-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 12px 16px 0;
      position: relative;
      z-index: 1;
    }
    .stat-pill {
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 5px 14px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }
    .stat-pill b { color: var(--text); font-weight: 700; }

    /* Options */

    /* Main */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 16px 32px;
      gap: 14px;
      position: relative;
      z-index: 1;
    }

    .arena {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* Slot card */
    .slot-wrap { width: 100%; }

    .slot-card {
      width: 100%;
      border-radius: 22px;
      padding: 24px 20px 20px;
      text-align: center;
      border: 1px solid var(--border);
      background: linear-gradient(145deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%);
      backdrop-filter: blur(16px);
      transition: border-color .5s, box-shadow .5s;
    }

    /* Drawing state */
    .slot-wrap.drawing .slot-card {
      border-color: rgba(168,85,247,.5);
      box-shadow:
        0 0 0 1px rgba(168,85,247,.15),
        0 0 50px rgba(168,85,247,.18),
        0 0 100px rgba(168,85,247,.08),
        inset 0 0 50px rgba(168,85,247,.06);
      animation: ring-pulse .7s ease-in-out infinite alternate;
    }
    @keyframes ring-pulse {
      from { box-shadow: 0 0 0 1px rgba(168,85,247,.1), 0 0 40px rgba(168,85,247,.15), inset 0 0 40px rgba(168,85,247,.04); }
      to   { box-shadow: 0 0 0 1px rgba(168,85,247,.35), 0 0 70px rgba(168,85,247,.28), inset 0 0 60px rgba(168,85,247,.1); }
    }

    /* Winner state */
    .slot-wrap.winner-shown .slot-card {
      border-color: rgba(251,191,36,.35);
      box-shadow:
        0 0 0 1px rgba(251,191,36,.12),
        0 0 60px rgba(251,191,36,.12),
        inset 0 0 50px rgba(251,191,36,.04);
    }

    .slot-eyebrow {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 14px;
    }

    .slot-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 44px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: 1px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slot-name.state-idle    { color: rgba(255,255,255,.15); }

    .slot-name.state-rolling {
      color: rgba(168,85,247,.85);
      animation: tick-flicker .08s steps(1) infinite;
    }
    @keyframes tick-flicker {
      0%  { opacity: 1; }
      50% { opacity: .75; }
    }

    .slot-name.state-winner {
      background: linear-gradient(130deg, var(--gold) 0%, var(--gold2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pop-winner .35s cubic-bezier(.175,.885,.32,1.275) both;
    }
    @keyframes pop-winner {
      0%   { transform: scale(.88); opacity: .6; }
      100% { transform: scale(1); opacity: 1; }
    }

    .slot-details {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-height: 34px;
    }
    .slot-num   { font-size: 13px; color: var(--muted); font-weight: 500; }
    .slot-email { font-size: 12px; color: rgba(251,191,36,.55); }

    /* CTA Button */
    .btn-draw {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      border-radius: 100px;
      padding: 13px 36px;
      cursor: pointer;
      transition: transform .15s, box-shadow .2s;
      background: linear-gradient(135deg, var(--v1) 0%, var(--p1) 100%);
      color: white;
      box-shadow: 0 8px 36px rgba(109,40,217,.35), 0 2px 8px rgba(0,0,0,.4);
    }
    .btn-draw:hover:not(:disabled) {
      transform: scale(1.04) translateY(-1px);
      box-shadow: 0 14px 44px rgba(109,40,217,.45), 0 2px 8px rgba(0,0,0,.4);
    }
    .btn-draw:active:not(:disabled) { transform: scale(.97); }
    .btn-draw:disabled {
      cursor: default;
      animation: btn-breathe .9s ease-in-out infinite alternate;
    }
    @keyframes btn-breathe {
      from { opacity: .4; transform: scale(.98); }
      to   { opacity: .65; transform: scale(1.01); }
    }

    /* Écran en colonne : la liste des gagnants se colle au bas de l'écran */
    #app { display: flex; flex-direction: column; flex: 1; min-height: 100vh; min-height: 100dvh; }
    #app main { flex: 1; }
    #history-section { margin-top: auto; padding-bottom: env(safe-area-inset-bottom, 0px); }

    /* Section */
    .section { width: 100%; max-width: 520px; }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--muted);
      font-weight: 600;
    }
    .btn-ghost {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
      padding: 4px 12px;
      cursor: pointer;
      transition: color .2s, border-color .2s;
      font-family: 'Inter', sans-serif;
    }
    .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,.2); }

    .history-list { display: flex; flex-direction: column; gap: 6px; }
    .history-item.new { animation: slide-up .45s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes slide-up {
      from { transform: translateY(60px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
    .history-item {
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }
    .hi-name { font-weight: 700; }
    .hi-sub  { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .hi-badge {
      background: rgba(109,40,217,.22);
      border: 1px solid rgba(109,40,217,.3);
      border-radius: 100px;
      padding: 2px 10px;
      font-size: 11px;
      color: rgba(168,85,247,.8);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Loading screen */
    #screen-loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 100;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 2px solid rgba(168,85,247,.18);
      border-top-color: var(--v2);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-txt { font-size: 14px; color: var(--muted); }

    /* Grand écran : cadre plus spacieux */
    @media (min-width: 700px) {
      .slot-card { padding: 40px 32px 34px; border-radius: 28px; }
      .slot-eyebrow { margin-bottom: 18px; }
      .slot-name { font-size: 64px; min-height: 76px; }
      .slot-details { margin-top: 14px; }
      .btn-draw { font-size: 21px; padding: 19px 60px; }
      main { padding: 32px 20px 56px; gap: 24px; }
      .arena { gap: 22px; }
    }

    /* Mobile : effets allégés pour que le tirage reste fluide */
    @media (max-width: 699px) {
      html { overflow-x: hidden; }
      .orb { filter: blur(50px); }
      .orb-1 { width: 320px; height: 320px; top: -100px; left: -100px; animation: none; }
      .orb-2 { width: 260px; height: 260px; bottom: -60px; right: -60px; animation: none; }
      .orb-3 { display: none; }
      .slot-card { backdrop-filter: none; -webkit-backdrop-filter: none; }
      .slot-wrap.drawing .slot-card { animation: none; }
      .btn-draw { max-width: 100%; }
    }

    /* Confetti */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div id="screen-loading">
  <div class="spinner"></div>
  <div class="loading-txt">Chargement des participants…</div>
</div>
<canvas id="confetti-canvas" hidden></canvas>

<div id="app" hidden>
  <div class="stats-row">
    <div class="stat-pill"><b id="stat-eligible">—</b> participants éligibles</div>
  </div>

  <main>
    <div class="arena">

      <div class="slot-wrap" id="slot-wrap">
        <div class="slot-card">
          <div class="slot-eyebrow">Participant sélectionné</div>
          <div class="slot-name state-idle" id="slot-name">?</div>
          <div class="slot-details">
            <div class="slot-num"  id="slot-numero"></div>
            <div class="slot-email" id="slot-email"></div>
          </div>
        </div>
      </div>

      <button class="btn-draw" id="btn-draw" onclick="startDraw()">
        Lancer le tirage
      </button>

    </div>

    <div class="section" id="history-section" hidden>
      <div class="section-header">
        <div class="section-title">Gagnants</div>
        <button class="btn-ghost" onclick="clearHistory()">Réinitialiser</button>
      </div>
      <div class="history-list" id="history-list"></div>
    </div>
  </main>
</div>

<script src="/js/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<script src="/js/auth.js?v=12"></script>
<script>
  let _participants = [];
  let _eligibles   = [];
  let _drawn       = [];
  let _round       = 0;
  let _rolling     = false;

  const STATUTS_PAYES = ['payee','production','livraison','confirmee','remise','physique'];

  window.addEventListener('DOMContentLoaded', async () => {
    const ok = await Auth.requireRole('membre');
    if (!ok) return;
    await loadParticipants();
    document.getElementById('screen-loading').hidden = true;
    document.getElementById('app').hidden = false;
  });

  async function loadParticipants() {
    const sb = window.Auth.sb;
    let all = [], page = 0, PAGE = 1000;
    while (true) {
      const { data, error } = await sb
        .from('boutique_commandes')
        .select('id, numero, nom_acheteur, email_acheteur, statut')
        .in('statut', STATUTS_PAYES)
        .order('created_at', { ascending: true })
        .range(page * PAGE, (page + 1) * PAGE - 1);
      if (error || !data?.length) break;
      all = all.concat(data);
      if (data.length < PAGE) break;
      page++;
    }
    _participants = all.map(c => ({
      nom:   c.nom_acheteur || 'Anonyme',
      email: c.email_acheteur || '',
      numero: c.numero || c.id.slice(0,8),
      commande_id: c.id,
    }));
    refreshEligibles();
  }

  function refreshEligibles() {
    const excludeDrawn = true;
    const onePerPerson = true;
    const drawnEmails  = new Set(_drawn.map(d => d.email.toLowerCase()));
    const drawnNoms    = new Set(_drawn.map(d => d.nom.toLowerCase()));
    const seenKey = new Set();
    _eligibles = _participants.filter(p => {
      if (excludeDrawn) {
        if (p.email && drawnEmails.has(p.email.toLowerCase())) return false;
        if (!p.email && drawnNoms.has(p.nom.toLowerCase())) return false;
      }
      if (onePerPerson) {
        const key = p.email ? p.email.toLowerCase() : p.nom.toLowerCase();
        if (seenKey.has(key)) return false;
        seenKey.add(key);
      }
      return true;
    });
    document.getElementById('stat-eligible').textContent = _eligibles.length;
  }

  function startDraw() {
    if (_rolling) return;
    if (_eligibles.length === 0) { alert('Plus de participants éligibles !'); return; }
    _rolling = true;
    _round++;

    const btn      = document.getElementById('btn-draw');
    const slotWrap = document.getElementById('slot-wrap');
    const slotName = document.getElementById('slot-name');
    const slotNum  = document.getElementById('slot-numero');
    const slotMail = document.getElementById('slot-email');

    btn.disabled = true;
    btn.textContent = '🎲';
    slotWrap.className = 'slot-wrap drawing';
    slotName.className = 'slot-name state-rolling';
    slotNum.textContent  = '';
    slotMail.textContent = '';

    const winner = _eligibles[Math.floor(Math.random() * _eligibles.length)];
    let ticks = 0;
    const totalTicks = 18;
    const interval = setInterval(() => {
      ticks++;
      if (ticks >= totalTicks) {
        clearInterval(interval);
        revealWinner(winner, slotWrap, slotName, slotNum, slotMail, btn);
        return;
      }
      const fake = _participants[Math.floor(Math.random() * _participants.length)];
      slotName.textContent = fake.nom.split(' ')[0];
    }, 80);
  }

  function revealWinner(winner, slotWrap, slotName, slotNum, slotMail, btn) {
    slotWrap.className = 'slot-wrap winner-shown';
    slotName.textContent = winner.nom;
    slotName.className   = 'slot-name state-winner';
    slotNum.textContent  = `Commande n° ${winner.numero}`;
    slotMail.textContent = winner.email || '';
    _drawn.push({ ...winner, round: _round });
    _rolling = false;
    btn.disabled = false;
    btn.textContent = 'Nouveau tirage';
    refreshEligibles();
    renderHistory();
    setTimeout(launchConfetti, 60);
  }

  function renderHistory() {
    const section = document.getElementById('history-section');
    const list    = document.getElementById('history-list');
    section.hidden = _drawn.length === 0;
    list.innerHTML = _drawn.map((d, i) => `
      <div class="history-item${i === _drawn.length - 1 ? ' new' : ''}">
        <div>
          <div class="hi-name">${d.nom}</div>
          <div class="hi-sub">n° ${d.numero}${d.email ? ' · ' + d.email : ''}</div>
        </div>
        <div class="hi-badge">Tirage ${d.round}</div>
      </div>`).join('');
  }

  function clearHistory() {
    _drawn = [];
    _round = 0;
    const slotWrap = document.getElementById('slot-wrap');
    const slotName = document.getElementById('slot-name');
    slotWrap.className  = 'slot-wrap';
    slotName.textContent = '?';
    slotName.className   = 'slot-name state-idle';
    document.getElementById('slot-numero').textContent = '';
    document.getElementById('slot-email').textContent  = '';
    document.getElementById('btn-draw').textContent    = 'Lancer le tirage';
    document.getElementById('btn-draw').disabled       = false;
    renderHistory();
    refreshEligibles();
  }

  function launchConfetti() {
    const canvas = document.getElementById('confetti-canvas');
    canvas.hidden = false;
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    const ctx = canvas.getContext('2d');
    const cols = ['#6D28D9','#A855F7','#EC4899','#FBBF24','#F97316','#ffffff'];
    const pieces = Array.from({ length: 110 }, () => ({
      x: Math.random() * canvas.width,
      y: -15,
      vx: (Math.random() - .5) * 3.5,
      vy: Math.random() * 4 + 2,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - .5) * .14,
      w: Math.random() * 11 + 5,
      h: Math.random() * 6 + 3,
      color: cols[Math.floor(Math.random() * cols.length)],
    }));
    let frame;
    const draw = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let alive = false;
      pieces.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vy += .05;
        if (p.y < canvas.height + 20) alive = true;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, 1 - (p.y / canvas.height) * 1.1);
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.restore();
      });
      if (alive) frame = requestAnimationFrame(draw);
      else canvas.hidden = true;
    };
    if (frame) cancelAnimationFrame(frame);
    requestAnimationFrame(draw);
  }
</script>
</body>
</html>
