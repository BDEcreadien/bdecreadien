name: Keep Supabase alive

on:
  schedule:
    # Toutes les 6 jours à 8h UTC — Supabase pause après 7j d'inactivité (free tier)
    - cron: '0 8 */6 * *'
  workflow_dispatch: # Permet de lancer manuellement depuis GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (lecture profils)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://zgscyfpqwbmwemzqtvpx.supabase.co/rest/v1/profils?select=count&limit=1" \
            -H "apikey: sb_publishable_m0ifDrZ8vL6MSMHPp00trQ_dkG3KzBm" \
            -H "Authorization: Bearer sb_publishable_m0ifDrZ8vL6MSMHPp00trQ_dkG3KzBm")
          echo "Supabase HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WARN: Supabase returned $STATUS — project may be paused"
            exit 1
          fi
