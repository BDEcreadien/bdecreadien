<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta property="og:description" content="Retrouvez ici tous nos réseaux sociaux et les photos de toutes nos soirées.">

  <meta name="theme-color" content="#460186">

  <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-v2-96x96.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Barlow', sans-serif;
      background: linear-gradient(160deg, #2D0057 0%, #460186 18%, #6A0F9E 35%, #9B1889 50%, #D2396D 68%, #F04A34 85%, #FF741F 100%);
      background-attachment: fixed;
      min-height: 100vh;
      color: white;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .bg-noise {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: radial-gradient(circle at 20% 30%, rgba(255,46,136,0.35) 0%, transparent 45%),
                        radial-gradient(circle at 80% 70%, rgba(255,116,31,0.30) 0%, transparent 50%);
      mix-blend-mode: screen;
    }
    .wrap {
      position: relative; z-index: 1;
      max-width: 540px;
      margin: 0 auto;
      padding: 3rem 1.25rem 4rem;
      display: flex; flex-direction: column; align-items: center;
    }
    .logo {
      width: 110px; height: 110px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.28), 0 0 0 3px rgba(255,255,255,0.15);
      animation: pulse 3.5s ease-in-out infinite;
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(30px, 7vw, 42px);
      letter-spacing: 2px;
      margin-top: 1rem;
      text-align: center;
      text-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }
    .intro {
      font-size: 15px;
      opacity: 0.92;
      margin-top: 12px;
      text-align: center;
      max-width: 460px;
      line-height: 1.5;
    }

    /* Barre de réseaux sociaux */
    .socials {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }
    .social-btn {
      width: 42px; height: 42px;
      display: inline-flex; align-items: center; justify-content: center;
      color: white;
      background: transparent;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.25s cubic-bezier(.2,.7,.2,1), opacity 0.2s;
      opacity: 0.9;
    }
    .social-btn:hover { transform: scale(1.15) rotate(-4deg); opacity: 1; }
    .social-btn svg { width: 28px; height: 28px; fill: currentColor; }

    /* Liste des liens principaux */
    .links {
      width: 100%;
      display: flex; flex-direction: column; gap: 12px;
      margin-top: 2rem;
    }
    .link-card {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 18px 12px 12px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.20);
      border-radius: 14px;
      text-decoration: none;
      color: white;
      font-weight: 600;
      font-size: 16px;
      transition: transform 0.25s cubic-bezier(.2,.7,.2,1), background 0.25s, box-shadow 0.25s, border-color 0.25s;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.10);
      opacity: 0;
      transform: translateY(12px);
      animation: reveal 0.5s cubic-bezier(.2,.7,.2,1) forwards;
      position: relative;
      overflow: hidden;
    }
    .link-card:nth-child(1) { animation-delay: 0.05s; }
    .link-card:nth-child(2) { animation-delay: 0.12s; }
    .link-card:nth-child(3) { animation-delay: 0.19s; }
    .link-card:nth-child(4) { animation-delay: 0.26s; }
    .link-card:nth-child(5) { animation-delay: 0.33s; }
    .link-card:nth-child(n+6) { animation-delay: 0.40s; }
    @keyframes reveal { to { opacity: 1; transform: translateY(0); } }
    .link-card:hover {
      transform: translateY(-3px) scale(1.01);
      background: rgba(255,255,255,0.20);
      border-color: rgba(255,255,255,0.35);
      box-shadow: 0 10px 26px rgba(0,0,0,0.18);
    }
    .link-card:active { transform: translateY(-1px) scale(0.995); }
    .link-thumb {
      width: 48px; height: 48px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: rgba(255,255,255,0.15);
    }
    .link-thumb-fallback {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .link-title { flex: 1; text-align: center; padding-right: 40px; }
    .footer {
      margin-top: 2.5rem;
      font-size: 12px;
      opacity: 0.7;
      text-align: center;
    }
    .footer a { color: white; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.4); }
    .loading, .empty, .error {
      margin-top: 2rem; padding: 1.5rem; text-align: center;
      background: rgba(255,255,255,0.08); border-radius: 12px;
      font-size: 14px; opacity: 0.85;
    }
    .error { background: rgba(220,50,50,0.18); }
    @media (prefers-reduced-motion: reduce) {
      .logo, .link-card { animation: none !important; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="bg-noise" aria-hidden="true"></div>

    <div id="socials" class="socials" role="list"></div>

    <div id="links" class="links" role="list"></div>

    <div id="loading" class="loading">Chargement…</div>
    <div id="empty" class="empty" style="display:none;">Aucun lien pour le moment.</div>
    <div id="error" class="error" style="display:none;">Impossible de charger les liens.</div>

    <div class="footer">
      <a href="/">Retour au site</a> · <a href="/agenda">Agenda</a> · <a href="/contact">Contact</a>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    (async function () {
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
      const loadingEl = document.getElementById('loading');
      const socialsEl = document.getElementById('socials');
      const listEl = document.getElementById('links');
      const emptyEl = document.getElementById('empty');
      const errorEl = document.getElementById('error');

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      }

      try {
        const { data, error } = await sb
          .from('liens')
          .select('id, titre, url, icone, image_url, type, social_icon, ordre')
          .eq('actif', true)
          .order('ordre', { ascending: true })
          .order('created_at', { ascending: true });

        loadingEl.style.display = 'none';

        if (error) { console.error(error); errorEl.style.display = 'block'; return; }
        if (!data || !data.length) { emptyEl.style.display = 'block'; return; }

        const socials = data.filter(l => l.type === 'social');
        const principaux = data.filter(l => l.type !== 'social');

        // Réseaux sociaux (icônes en tête)
        socialsEl.innerHTML = socials.map(l => {
          const key = (l.social_icon || '').toLowerCase();
          const icon = SOCIAL_ICONS[key] || SOCIAL_ICONS.website;
          const label = SOCIAL_LABELS[key] || l.titre || 'Lien';
          const isExternal = /^https?:\/\//.test(l.url);
          const targetAttr = isExternal ? ' target="_blank" rel="noopener noreferrer"' : '';
          return `<a class="social-btn" href="${esc(l.url)}"${targetAttr}
                     data-track="lien:${esc(l.id)}" title="${esc(label)}" aria-label="${esc(label)}"
                     role="listitem">${icon}</a>`;
        }).join('');

        // Liens principaux (cartes)
        listEl.innerHTML = principaux.map(l => {
          const isExternal = /^https?:\/\//.test(l.url);
          const targetAttr = isExternal ? ' target="_blank" rel="noopener noreferrer"' : '';
          const thumb = l.image_url
            ? `<img class="link-thumb" src="${esc(l.image_url)}" alt="" loading="lazy">`
            : `<span class="link-thumb-fallback" aria-hidden="true">${esc(l.icone || '🔗')}</span>`;
          return `<a class="link-card" href="${esc(l.url)}"${targetAttr}
                     data-track="lien:${esc(l.id)}" role="listitem">
                    ${thumb}
                    <span class="link-title">${esc(l.titre)}</span>
                  </a>`;
        }).join('');

        if (!socials.length && !principaux.length) emptyEl.style.display = 'block';
      } catch (err) {
        console.error(err);
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
      }
    })();
  </script>
  <script defer src="/js/tracker.js?v=2"></script>
