<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — BDE CREAD Lyon</title>
  <link rel="stylesheet" href="css/style.css?v=16">
  <link rel="icon" type="image/png" href="assets/favicon-bde.png">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-C8REVEGYYL"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-C8REVEGYYL');</script>
  <style>
    body { background: var(--gris-clair); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }

    .auth-card {
      background: white;
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 4px 32px rgba(70,58,144,0.08);
    }

    .auth-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .auth-logo img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .auth-logo-text { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; color: var(--violet); }

    .auth-tabs { display: flex; border-bottom: 2px solid var(--gris-clair); margin-bottom: 28px; }
    .auth-tab {
      flex: 1; padding: 10px; text-align: center;
      font-family: 'Barlow Condensed', sans-serif; font-size: 14px; letter-spacing: 0.5px;
      color: var(--gris-texte); cursor: pointer; border: none; background: none;
      border-bottom: 2px solid transparent; margin-bottom: -2px;
      transition: var(--transition); text-transform: uppercase;
    }
    .auth-tab.active { color: var(--violet); border-bottom-color: var(--violet); font-weight: 600; }

    .auth-panel { display: none; }
    .auth-panel.active { display: block; }

    .auth-field { margin-bottom: 16px; }
    .auth-field label { display: block; font-size: 12px; font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.5px; color: var(--gris-texte); margin-bottom: 6px; }
    .auth-field input,
    .auth-field select {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid var(--gris-moyen); border-radius: 10px;
      font-family: 'Barlow', sans-serif; font-size: 14px; color: var(--noir);
      background: white; transition: var(--transition); outline: none; box-sizing: border-box;
    }
    .auth-field input:focus,
    .auth-field select:focus { border-color: var(--violet); }

    .pwd-wrap { position: relative; }
    .pwd-wrap input { padding-right: 44px; width: 100%; }
    .pwd-toggle {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: none; padding: 6px 10px; cursor: pointer;
      font-size: 16px; opacity: 0.55; transition: opacity 0.2s;
    }
    .pwd-toggle:hover { opacity: 1; }

    .auth-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .auth-btn {
      width: 100%; padding: 12px; background: var(--gradient);
      border: none; border-radius: 12px; color: white;
      font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 600;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      transition: var(--transition); margin-top: 4px;
    }
    .auth-btn:hover { opacity: 0.9; }
    .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .auth-msg {
      margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: 13px; display: none;
    }
    .auth-msg.error   { background: #FFF0F0; color: #C0392B; border: 1px solid #F5C0C0; }
    .auth-msg.success { background: #F0FFF4; color: #1A7A40; border: 1px solid #B0E8C4; }
    .auth-msg.visible { display: block; }

    .auth-divider { text-align: center; font-size: 12px; color: var(--gris-moyen); margin: 8px 0 14px; }
    .auth-link { font-size: 13px; color: var(--violet); cursor: pointer; background: none; border: none; text-decoration: underline; padding: 0; }

    .auth-success-screen { text-align: center; padding: 20px 0; }
    .auth-success-screen .big-check { font-size: 48px; margin-bottom: 12px; }
    .auth-success-screen h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; color: var(--violet); margin-bottom: 8px; }
    .auth-success-screen p { font-size: 14px; color: var(--gris-texte); line-height: 1.6; }
  </style>
</head>
<body>
  <a href="/" style="position:fixed;top:20px;left:24px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--gris-texte);text-decoration:none;display:flex;align-items:center;gap:6px;opacity:0.6;transition:opacity 0.2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.6">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Accueil
  </a>
  <div class="auth-card">
    <div class="auth-logo">
      <img src="assets/Logo.png" alt="BDE CREAD">
      <span class="auth-logo-text">BDE CREAD Lyon</span>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="showTab('connexion')">Connexion</button>
      <button class="auth-tab" onclick="showTab('inscription')">Inscription</button>
    </div>

    <!-- CONNEXION -->
    <div id="panel-connexion" class="auth-panel active">
      <div class="auth-field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="ton@email.com" autocomplete="email">
      </div>
      <div class="auth-field">
        <label for="login-pwd">Mot de passe</label>
        <div class="pwd-wrap">
          <input type="password" id="login-pwd" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="pwd-toggle" aria-label="Afficher le mot de passe" onclick="togglePwd('login-pwd', this)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <button class="auth-btn" onclick="doLogin()">Se connecter</button>
      <div class="auth-divider">ou</div>
      <div style="text-align:center;">
        <button class="auth-link" onclick="showTab('reset')">Mot de passe oublié ?</button>
      </div>
      <div id="login-msg" class="auth-msg"></div>
    </div>

    <!-- INSCRIPTION -->
    <div id="panel-inscription" class="auth-panel">
      <div class="auth-row">
        <div class="auth-field">
          <label for="reg-prenom">Prénom *</label>
          <input type="text" id="reg-prenom" placeholder="Marie" autocomplete="given-name">
        </div>
        <div class="auth-field">
          <label for="reg-nom">Nom *</label>
          <input type="text" id="reg-nom" placeholder="Dupont" autocomplete="family-name">
        </div>
      </div>
      <div class="auth-field">
        <label for="reg-email">Email *</label>
        <input type="email" id="reg-email" placeholder="ton@email.com" autocomplete="email">
      </div>
      <div class="auth-field">
        <label for="reg-pwd">Mot de passe * (min. 8 caractères)</label>
        <div class="pwd-wrap">
          <input type="password" id="reg-pwd" placeholder="••••••••" autocomplete="new-password">
          <button type="button" class="pwd-toggle" aria-label="Afficher le mot de passe" onclick="togglePwd('reg-pwd', this)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <div class="auth-row">
        <div class="auth-field">
          <label for="reg-annee">Année d&#39;étude *</label>
          <select id="reg-annee">
            <option value="1ère">1ère année</option>
            <option value="2ème">2ème année</option>
            <option value="3ème">3ème année</option>
            <option value="4ème">4ème année</option>
            <option value="5ème">5ème année</option>
          </select>
        </div>
        <div class="auth-field">
          <label for="reg-tel">Téléphone *</label>
          <input type="tel" id="reg-tel" placeholder="06 xx xx xx xx" autocomplete="tel">
        </div>
      </div>
      <button class="auth-btn" onclick="doSignup()">Créer mon compte</button>
      <div id="reg-msg" class="auth-msg"></div>
    </div>

    <!-- SUCCÈS après inscription -->
    <div id="panel-success" class="auth-panel">
      <div class="auth-success-screen">
        <div class="big-check">✅</div>
        <h2>Compte créé !</h2>
        <p>Un email de confirmation a été envoyé à <strong id="reg-email-confirm"></strong>.<br>Clique sur le lien dans l'email pour activer ton compte.</p>
        <a href="/" style="display:inline-block;margin-top:24px;padding:12px 32px;background:var(--gradient);color:white;border-radius:12px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;text-decoration:none;">Retour à l'accueil</a>
      </div>
    </div>

    <!-- RESET MOT DE PASSE (demande) -->
    <div id="panel-reset" class="auth-panel">
      <div class="auth-field">
        <label>Ton email</label>
        <input type="email" id="reset-email" placeholder="ton@email.com" autocomplete="email">
      </div>
      <button class="auth-btn" onclick="doReset()">Envoyer le lien de réinitialisation</button>
      <div id="reset-msg" class="auth-msg"></div>
    </div>

    <!-- NOUVEAU MOT DE PASSE (après clic sur le lien email) -->
    <div id="panel-new-password" class="auth-panel">
      <div style="text-align:center;margin-bottom:20px;">
        <h2 style="font-family:'Barlow Condensed',sans-serif;font-size:22px;color:var(--violet);margin:0 0 6px;">Choisir un nouveau mot de passe</h2>
        <p style="font-size:13px;color:var(--gris-texte);margin:0;">Saisis ton nouveau mot de passe pour te reconnecter.</p>
      </div>
      <div class="auth-field">
        <label for="new-pwd">Nouveau mot de passe (min. 8 caractères)</label>
        <div class="pwd-wrap">
          <input type="password" id="new-pwd" placeholder="••••••••" autocomplete="new-password">
          <button type="button" class="pwd-toggle" aria-label="Afficher" onclick="togglePwd('new-pwd', this)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <div class="auth-field">
        <label for="new-pwd-confirm">Confirme ton mot de passe</label>
        <div class="pwd-wrap">
          <input type="password" id="new-pwd-confirm" placeholder="••••••••" autocomplete="new-password">
          <button type="button" class="pwd-toggle" aria-label="Afficher" onclick="togglePwd('new-pwd-confirm', this)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <button class="auth-btn" onclick="doUpdatePassword()">Mettre à jour</button>
      <div id="new-pwd-msg" class="auth-msg"></div>
    </div>
  </div>

  <script>
    // Nettoie les anciens service workers pour éviter qu'ils bloquent les requêtes Supabase
    if ('serviceWorker' in navigator && !sessionStorage.getItem('sw-cleaned')) {
      sessionStorage.setItem('sw-cleaned', '1');
      navigator.serviceWorker.getRegistrations().then(regs => {
        if (regs.length) {
          Promise.all(regs.map(r => r.unregister())).then(() => location.reload());
        }
      });
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

    // Détecte si on arrive depuis un lien de reset password
    const _hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const _isRecovery = _hash.get('type') === 'recovery' || new URLSearchParams(window.location.search).get('type') === 'recovery';
    let _recoveryMode = _isRecovery;
    sb.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') {
        _recoveryMode = true;
        showTab('new-password');
      }
    });

    sb.auth.getUser().then(({ data: { user } }) => {
      if (_recoveryMode) {
        showTab('new-password');
        return;
      }
      if (user) {
        const next = new URLSearchParams(window.location.search).get('next') || '/';
        window.location.href = next;
      }
    });

    async function doUpdatePassword() {
      hideMsg('new-pwd-msg');
      const pwd = document.getElementById('new-pwd').value;
      const confirm = document.getElementById('new-pwd-confirm').value;
      if (pwd.length < 8) { showMsg('new-pwd-msg', 'Le mot de passe doit faire au moins 8 caractères.', 'error'); return; }
      if (pwd !== confirm) { showMsg('new-pwd-msg', 'Les deux mots de passe ne correspondent pas.', 'error'); return; }
      const btn = document.querySelector('#panel-new-password .auth-btn');
      btn.disabled = true; btn.textContent = 'Mise à jour…';
      const { error } = await sb.auth.updateUser({ password: pwd });
      btn.disabled = false; btn.textContent = 'Mettre à jour';
      if (error) { showMsg('new-pwd-msg', error.message, 'error'); return; }
      showMsg('new-pwd-msg', 'Mot de passe modifié ! Redirection vers ton espace…', 'success');
      setTimeout(() => { window.location.href = '/mon-espace.html'; }, 1500);
    }

    const _svgEye = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    const _svgEyeOff = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
    function togglePwd(inputId, btn) {
      const el = document.getElementById(inputId);
      if (!el) return;
      const isPwd = el.type === 'password';
      el.type = isPwd ? 'text' : 'password';
      btn.innerHTML = isPwd ? _svgEyeOff : _svgEye;
      btn.setAttribute('aria-label', isPwd ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
    }

    function showTab(name) {
      ['connexion','inscription','reset','success','new-password'].forEach(t => {
        const panel = document.getElementById('panel-' + t);
        if (panel) panel.classList.remove('active');
      });
      document.querySelectorAll('.auth-tab').forEach((tab, i) => {
        tab.classList.remove('active');
        if (['connexion','inscription','reset'][i] === name) tab.classList.add('active');
      });
      const target = document.getElementById('panel-' + name);
      if (target) target.classList.add('active');
    }

    function showMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = 'auth-msg ' + type + ' visible';
    }
    function hideMsg(id) {
      document.getElementById(id).className = 'auth-msg';
    }

    async function doLogin() {
      hideMsg('login-msg');
      const email = document.getElementById('login-email').value.trim();
      const pwd   = document.getElementById('login-pwd').value;
      if (!email || !pwd) { showMsg('login-msg', 'Remplis tous les champs.', 'error'); return; }

      const btn = document.querySelector('#panel-connexion .auth-btn');
      btn.disabled = true; btn.textContent = 'Connexion…';

      const { error } = await sb.auth.signInWithPassword({ email, password: pwd });
      btn.disabled = false; btn.textContent = 'Se connecter';

      if (error) {
        const msg = error.message === 'Invalid login credentials'
          ? 'Email ou mot de passe incorrect.'
          : error.message === 'Email not confirmed'
          ? 'Confirme ton email avant de te connecter. Vérifie ta boîte de réception (et les spams).'
          : (error.message === 'Load failed' || error.message === 'Failed to fetch' || error.message.includes('network'))
          ? 'Impossible de joindre le serveur. Recharge la page et réessaie. Si le problème persiste, vide le cache de ton navigateur.'
          : error.message;
        showMsg('login-msg', msg, 'error');
        return;
      }
      const rawNext = new URLSearchParams(window.location.search).get('next') || '/';
      const next = (rawNext.startsWith('/') && !rawNext.startsWith('//')) ? rawNext : '/';
      window.location.href = next;
    }

    async function doSignup() {
      hideMsg('reg-msg');
      const prenom = document.getElementById('reg-prenom').value.trim();
      const nom    = document.getElementById('reg-nom').value.trim();
      const email  = document.getElementById('reg-email').value.trim();
      const pwd    = document.getElementById('reg-pwd').value;
      const annee  = document.getElementById('reg-annee').value;
      const tel    = document.getElementById('reg-tel').value.trim();

      if (!prenom || !nom || !email || !pwd || !annee || !tel) {
        showMsg('reg-msg', 'Remplis tous les champs obligatoires (*).', 'error');
        return;
      }

      const btn = document.querySelector('#panel-inscription .auth-btn');
      btn.disabled = true; btn.textContent = 'Création…';

      const { error } = await sb.auth.signUp({
        email,
        password: pwd,
        options: { data: { prenom, nom, annee, telephone: tel || null } }
      });

      btn.disabled = false; btn.textContent = 'Créer mon compte';

      if (error) {
        const msg = (error.message === 'Load failed' || error.message === 'Failed to fetch' || error.message.includes('network'))
          ? 'Impossible de joindre le serveur. Recharge la page et réessaie.'
          : error.message;
        showMsg('reg-msg', msg, 'error');
        return;
      }

      document.getElementById('reg-email-confirm').textContent = email;
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-success').classList.add('active');

      if (window.OneSignalDeferred) {
        OneSignalDeferred.push(async (OS) => { await OS.User.PushSubscription.optIn(); });
      }
    }

    async function doReset() {
      hideMsg('reset-msg');
      const email = document.getElementById('reset-email').value.trim();
      if (!email) { showMsg('reset-msg', 'Saisis ton email.', 'error'); return; }

      const btn = document.querySelector('#panel-reset .auth-btn');
      btn.disabled = true; btn.textContent = 'Envoi…';

      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: 'https://bdecreadien.fr/connexion.html'
      });

      btn.disabled = false; btn.textContent = 'Envoyer le lien de réinitialisation';
      if (error) { showMsg('reset-msg', error.message, 'error'); return; }
      showMsg('reset-msg', 'Email envoyé ! Vérifie ta boîte de réception.', 'success');
    }

    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const active = document.querySelector('.auth-panel.active');
      if (!active) return;
      if (active.id === 'panel-connexion') doLogin();
      else if (active.id === 'panel-inscription') doSignup();
      else if (active.id === 'panel-reset') doReset();
    });
  </script>
</body>
</html>
