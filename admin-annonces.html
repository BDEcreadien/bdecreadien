<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modération annonces — BDE CREAD Lyon</title>
  <link rel="stylesheet" href="css/style.css?v=10">
  <link rel="icon" type="image/png" href="assets/Logo.png?v=2">
  <style>
    body { background: var(--gris-clair); min-height: 100vh; font-family: 'Barlow', sans-serif; }
    .adm-wrap { max-width: 1000px; margin: 0 auto; padding: 100px 24px 60px; }
    .adm-header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--violet); letter-spacing: 1px; }
    .adm-header p  { font-size: 14px; color: var(--gris-texte); margin-top: 4px; }

    .adm-tabs {
      display: flex; gap: 6px; margin: 24px 0 18px;
      background: white; border-radius: 12px; padding: 4px;
      box-shadow: 0 4px 24px rgba(70,58,144,0.06); width: fit-content;
    }
    .adm-tab {
      padding: 8px 20px; border-radius: 10px; border: none; background: none;
      font-family: 'Barlow Condensed', sans-serif; font-size: 13px;
      letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer;
      color: var(--gris-texte); transition: var(--transition);
    }
    .adm-tab.active { background: var(--gradient); color: white; }
    .adm-tab .count { opacity: 0.7; margin-left: 4px; font-size: 11px; }

    .adm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

    .adm-annonce {
      background: white; border-radius: 16px; overflow: hidden;
      box-shadow: 0 4px 24px rgba(70,58,144,0.08);
      display: flex; flex-direction: column;
    }
    .adm-annonce-photo { width: 100%; height: 180px; object-fit: cover; background: var(--gris-clair); }
    .adm-annonce-nophoto {
      width: 100%; height: 180px; background: var(--gradient); color: white;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bebas Neue', sans-serif; font-size: 40px;
    }
    .adm-annonce-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
    .adm-annonce-cat {
      font-family: 'Barlow Condensed', sans-serif; font-size: 11px;
      letter-spacing: 1px; text-transform: uppercase; color: var(--violet);
      margin-bottom: 6px;
    }
    .adm-annonce-title { font-weight: 700; font-size: 15px; color: var(--noir); margin-bottom: 6px; }
    .adm-annonce-desc { font-size: 13px; color: var(--gris-texte); line-height: 1.5; margin-bottom: 12px; }
    .adm-annonce-meta {
      font-size: 12px; color: var(--gris-moyen);
      padding-top: 10px; border-top: 1px solid var(--gris-clair);
      margin-top: auto;
    }

    .adm-actions { display: flex; gap: 8px; padding: 12px 16px; background: var(--gris-clair); }
    .adm-btn {
      flex: 1; padding: 8px; border: none; border-radius: 8px;
      font-family: 'Barlow Condensed', sans-serif; font-size: 12px;
      letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer;
      transition: var(--transition);
    }
    .adm-btn.approve { background: #1A7A40; color: white; }
    .adm-btn.reject  { background: #C0392B; color: white; }
    .adm-btn.delete  { background: var(--noir); color: white; }
    .adm-btn:hover { opacity: 0.85; }

    .adm-empty {
      text-align: center; padding: 60px 20px; background: white;
      border-radius: 20px; color: var(--gris-texte);
    }

    .adm-status {
      display: inline-block; font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase;
      padding: 3px 8px; border-radius: 20px; margin-left: 6px;
    }
    .adm-status.pending   { background: #FFF3E0; color: #E67E22; }
    .adm-status.published { background: #F0FFF4; color: #1A7A40; }
    .adm-status.rejected  { background: #FFF0F0; color: #C0392B; }
  </style>
</head>
<body>

  <nav id="navbar" class="scrolled" aria-label="Navigation principale">
    <a href="index.html" class="nav-logo">
      <img src="assets/Logo.png" alt="Logo" width="44" height="44" style="border-radius:50%; object-fit:cover;">
      <div class="nav-logo-text">
        <span class="bde">BDE LYON</span>
        <span class="cread">CREAD</span>
      </div>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Accueil</a></li>
      <li><a href="agenda.html">Agenda</a></li>
      <li><a href="communication.html">Communication</a></li>
      <li><a href="annonces.html">Annonces</a></li>
      <li><a href="partenaires.html">Partenaires</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <button class="nav-burger" id="nav-burger" aria-expanded="false" aria-label="Ouvrir le menu">
      <span class="nav-burger-line"></span>
      <span class="nav-burger-line"></span>
      <span class="nav-burger-line"></span>
    </button>
  </nav>

  <div class="adm-wrap">
    <div class="adm-header">
      <h1>Modération des annonces</h1>
      <p>Valide, refuse ou supprime les annonces publiées par les étudiants.</p>
    </div>

    <div class="adm-tabs">
      <button class="adm-tab active" data-tab="pending"   onclick="setTab('pending')">En attente <span class="count" id="c-pending">0</span></button>
      <button class="adm-tab"        data-tab="published" onclick="setTab('published')">Publiées <span class="count" id="c-published">0</span></button>
      <button class="adm-tab"        data-tab="rejected"  onclick="setTab('rejected')">Refusées <span class="count" id="c-rejected">0</span></button>
    </div>

    <div id="adm-content"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js?v=4"></script>
  <script src="js/main.js?v=4"></script>
  <script>
    const CAT_LABELS = { materiel: 'Matériel', place: 'Place', logement: 'Logement', service: 'Service', autre: 'Autre' };
    let allAnnonces = [];
    let currentTab = 'pending';

    document.addEventListener('DOMContentLoaded', async () => {
      const ok = await Auth.requireRole('admin');
      if (!ok) return;
      loadAll();
    });

    async function loadAll() {
      const { data, error } = await Auth.sb.from('annonces')
        .select('*, profils!annonces_auteur_id_fkey(prenom, nom, email:id)')
        .order('created_at', { ascending: false });

      if (error) { document.getElementById('adm-content').innerHTML = `<div class="adm-empty">Erreur : ${error.message}</div>`; return; }
      allAnnonces = data || [];

      document.getElementById('c-pending').textContent   = allAnnonces.filter(a => a.statut === 'pending').length;
      document.getElementById('c-published').textContent = allAnnonces.filter(a => a.statut === 'published').length;
      document.getElementById('c-rejected').textContent  = allAnnonces.filter(a => a.statut === 'rejected').length;

      render();
    }

    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.adm-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      render();
    }

    function render() {
      const list = allAnnonces.filter(a => a.statut === currentTab);
      const wrap = document.getElementById('adm-content');

      if (list.length === 0) {
        wrap.innerHTML = `<div class="adm-empty">Aucune annonce dans cette catégorie.</div>`;
        return;
      }

      wrap.innerHTML = `<div class="adm-grid">${list.map(renderCard).join('')}</div>`;
    }

    function renderCard(a) {
      const auteur = a.profils ? `${a.profils.prenom} ${a.profils.nom}` : 'Inconnu';
      const date = new Date(a.created_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });

      const actions = a.statut === 'pending'
        ? `<button class="adm-btn approve" onclick="setStatut('${a.id}','published')">✓ Valider</button>
           <button class="adm-btn reject"  onclick="setStatut('${a.id}','rejected')">✕ Refuser</button>`
        : a.statut === 'rejected'
        ? `<button class="adm-btn approve" onclick="setStatut('${a.id}','published')">✓ Valider quand même</button>
           <button class="adm-btn delete"  onclick="deleteAnnonce('${a.id}')">🗑 Supprimer</button>`
        : `<button class="adm-btn reject"  onclick="setStatut('${a.id}','pending')">↻ Remettre en attente</button>
           <button class="adm-btn delete"  onclick="deleteAnnonce('${a.id}')">🗑 Supprimer</button>`;

      return `
        <div class="adm-annonce">
          ${a.photo_url
            ? `<img class="adm-annonce-photo" src="${a.photo_url}" alt="">`
            : `<div class="adm-annonce-nophoto">${(CAT_LABELS[a.categorie]||'?')[0]}</div>`}
          <div class="adm-annonce-body">
            <div class="adm-annonce-cat">${CAT_LABELS[a.categorie]||''} · ${a.prix || 'Gratuit'}</div>
            <div class="adm-annonce-title">${escapeHtml(a.titre)}</div>
            <div class="adm-annonce-desc">${escapeHtml(a.description).slice(0,200)}${a.description.length>200?'…':''}</div>
            ${a.contact ? `<div style="font-size:12px;color:var(--gris-texte);margin-bottom:8px;">📞 ${escapeHtml(a.contact)}</div>` : ''}
            <div class="adm-annonce-meta">Par ${escapeHtml(auteur)} · ${date}</div>
          </div>
          <div class="adm-actions">${actions}</div>
        </div>
      `;
    }

    async function setStatut(id, statut) {
      const { error } = await Auth.sb.from('annonces').update({ statut }).eq('id', id);
      if (error) { alert(error.message); return; }
      loadAll();
    }

    async function deleteAnnonce(id) {
      if (!confirm('Supprimer définitivement cette annonce ?')) return;
      const { error } = await Auth.sb.from('annonces').delete().eq('id', id);
      if (error) { alert(error.message); return; }
      loadAll();
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
</body>
</html>
