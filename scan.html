<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scanner BDE</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#0a0010; color:white; overflow:hidden; height:100dvh; }

    /* ── Auth ── */
    #auth-screen { position:fixed;top:0;left:0;right:0;bottom:0;background:#f5f0ff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;z-index:200; }
    .auth-input { width:100%;padding:14px 16px;border:1.5px solid #e0d8f0;border-radius:12px;font-size:15px;outline:none;background:white;color:#1a0030;margin-bottom:10px; }
    .auth-input:focus { border-color:#460186; }
    .auth-btn { width:100%;padding:16px;background:linear-gradient(135deg,#460186,#D2396D);color:white;border:none;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer; }

    /* ── Fidélité PIN screen ── */
    #fidelite-pin-screen { position:fixed;top:0;left:0;right:0;bottom:0;background:#f5f0ff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px;z-index:200; }
    .pin-input { width:100%;padding:14px 16px;border:1.5px solid #e0d8f0;border-radius:12px;font-size:15px;outline:none;background:white;color:#1a0030;margin-bottom:10px; }
    .pin-input:focus { border-color:#460186; }

    /* ── Scanner ── */
    #scanner-screen { display:none;position:relative;height:100dvh;overflow:hidden; }
    #video { position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;object-fit:cover; }
    #canvas { display:none; }

    /* header */
    .scan-header { position:absolute;top:0;left:0;right:0;z-index:10;background:linear-gradient(to bottom,rgba(0,0,0,.65),transparent);padding:env(safe-area-inset-top,0px) 20px 32px;padding-top:max(env(safe-area-inset-top,0px),16px); }

    /* scan zone */
    .scan-frame { position:absolute;top:50%;left:50%;transform:translate(-50%,-58%);width:260px;height:260px;pointer-events:none; }
    .scan-frame svg { width:100%;height:100%; }
    .scan-label { position:absolute;top:50%;left:50%;transform:translate(-50%,calc(-50% + 155px));font-size:13px;opacity:.75;white-space:nowrap;pointer-events:none; }

    /* bottom bar */
    .scan-bottom { position:absolute;bottom:0;left:0;right:0;z-index:10;background:rgba(0,0,0,.55);backdrop-filter:blur(12px);padding:16px 24px max(env(safe-area-inset-bottom,0px),16px); }

    /* ── Popup ── */
    #scan-popup { position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;display:flex;align-items:flex-end;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s; }
    #scan-popup.open { opacity:1;pointer-events:auto; }
    .popup-card { background:white;border-radius:24px 24px 0 0;width:100%;padding:28px 24px max(env(safe-area-inset-bottom,0px),24px);color:#1a0030;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1); }
    #scan-popup.open .popup-card { transform:translateY(0); }

    /* ── Flash ── */
    #flash { position:fixed;top:0;left:0;right:0;bottom:0;z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;pointer-events:none;opacity:0;transition:opacity .15s; }
    #flash.show { opacity:1; }
    #flash.hide { opacity:0;transition:opacity .6s; }
    .flash-name { font-size:22px;font-weight:800;color:white;text-shadow:0 2px 8px rgba(0,0,0,.4); }
  </style>
</head>
<body>

<!-- ── Fidélité PIN screen ── -->
<div id="fidelite-pin-screen">
  <div style="text-align:center;margin-bottom:36px">
    <div style="background:linear-gradient(135deg,#460186,#D2396D);border-radius:22px;width:72px;height:72px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 8px 24px rgba(70,1,134,.35)">
      <svg width="34" height="34" fill="none" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="white"/></svg>
    </div>
    <h1 style="margin:0 0 4px;font-size:26px;font-weight:800;color:#1a0030">Cartes fidélité</h1>
    <p style="margin:0;color:#888;font-size:14px">BDE CREAD Lyon</p>
  </div>
  <div style="width:100%;max-width:360px">
    <input id="pin-code" class="pin-input" type="password" inputmode="numeric" placeholder="Code PIN" autocomplete="off">
    <input id="pin-validateur" class="pin-input" type="text" placeholder="Ton prénom (validateur)" autocomplete="off">
    <input id="pin-event" class="pin-input" type="text" placeholder="Nom de l'événement" autocomplete="off">
    <button class="auth-btn" onclick="startFideliteScanner()">Démarrer le scanner</button>
    <div id="pin-error" style="color:#dc2626;font-size:13px;text-align:center;margin-top:10px;min-height:18px"></div>
  </div>
</div>

<!-- ── Auth ── -->
<div id="auth-screen">
  <div style="text-align:center;margin-bottom:36px">
    <div style="background:linear-gradient(135deg,#460186,#D2396D);border-radius:22px;width:72px;height:72px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 8px 24px rgba(70,1,134,.35)">
      <svg width="34" height="34" fill="none" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5" stroke="white" stroke-width="2"/><rect x="13" y="3" width="8" height="8" rx="1.5" stroke="white" stroke-width="2"/><rect x="3" y="13" width="8" height="8" rx="1.5" stroke="white" stroke-width="2"/><rect x="13" y="13" width="4" height="4" rx=".75" fill="white"/><rect x="19" y="13" width="2" height="2" rx=".5" fill="white"/><rect x="19" y="19" width="2" height="2" rx=".5" fill="white"/><rect x="13" y="19" width="2" height="2" rx=".5" fill="white"/></svg>
    </div>
    <h1 style="margin:0 0 4px;font-size:26px;font-weight:800;color:#1a0030">Scanner</h1>
    <p style="margin:0;color:#888;font-size:14px">BDE CREAD Lyon</p>
  </div>
  <div id="auth-loading" style="color:#888;font-size:14px">Vérification…</div>
  <div id="auth-form" style="display:none;width:100%;max-width:360px">
    <input id="auth-email" class="auth-input" type="email" placeholder="Email" autocomplete="email">
    <input id="auth-password" class="auth-input" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <button class="auth-btn" onclick="doLogin()">Se connecter</button>
    <div id="auth-error" style="color:#dc2626;font-size:13px;text-align:center;margin-top:10px;min-height:18px"></div>
  </div>
</div>

<!-- ── Scanner ── -->
<div id="scanner-screen">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <!-- Header -->
  <div class="scan-header">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:17px;font-weight:800;line-height:1.2" id="scan-event-name">Billetterie</div>
        <div style="font-size:13px;opacity:.75;margin-top:2px" id="scan-counter">Chargement…</div>
      </div>
      <a href="admin.html" style="color:white;font-size:13px;font-weight:600;text-decoration:none;background:rgba(255,255,255,.18);padding:7px 14px;border-radius:20px">Admin</a>
    </div>
  </div>

  <!-- Scan zone -->
  <div class="scan-frame" id="scan-frame">
    <svg viewBox="0 0 260 260" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 60 L20 20 L60 20" stroke="white" stroke-width="4" stroke-linecap="round"/>
      <path d="M200 20 L240 20 L240 60" stroke="white" stroke-width="4" stroke-linecap="round"/>
      <path d="M240 200 L240 240 L200 240" stroke="white" stroke-width="4" stroke-linecap="round"/>
      <path d="M60 240 L20 240 L20 200" stroke="white" stroke-width="4" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="scan-label">Pointez vers un QR code</div>

  <!-- Bottom -->
  <div class="scan-bottom">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:13px;opacity:.8" id="scan-status">Scanner actif</div>
      <div style="display:flex;gap:8px">
        <button onclick="refreshCounter()" style="background:rgba(255,255,255,.18);border:none;color:white;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer">Actualiser</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Popup confirmation ── -->
<div id="scan-popup" onclick="if(event.target===this)closePopup()">
  <div class="popup-card">
    <div id="popup-content"></div>
  </div>
</div>

<!-- ── Flash visuel ── -->
<div id="flash">
  <svg id="flash-icon" width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="40" fill="rgba(255,255,255,.25)"/><path d="M24 40l12 12 20-24" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
  <div class="flash-name" id="flash-name"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="js/supabase-config.js?v=2"></script>
<script src="js/auth.js"></script>
<script>
let scanning = false;
let stream = null;
let currentInscription = null;
let billetterieId = null;
let billetterieNom = '';
let totalPresents = 0;
let totalInscrits = 0;
let modeFidelite = false;
let fidelitePin = '';
let fideliteValidateur = '';
let fideliteEvent = '';

const params = new URLSearchParams(location.search);
billetterieId = params.get('bil');

// Mode fidélité : pas de ?bil= dans l'URL
modeFidelite = !billetterieId;

// ── Auth ──
async function init() {
  if (modeFidelite) {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('fidelite-pin-screen').style.display = 'flex';
    return;
  }
  const user = await Auth.getUser().catch(() => null);
  if (user) {
    document.getElementById('auth-screen').style.display = 'none';
    startScanner();
  } else {
    document.getElementById('auth-loading').style.display = 'none';
    document.getElementById('auth-form').style.display = '';
  }
}

async function startFideliteScanner() {
  const pin = document.getElementById('pin-code').value.trim();
  const validateur = document.getElementById('pin-validateur').value.trim();
  const event = document.getElementById('pin-event').value.trim();
  if (!pin || !validateur || !event) {
    document.getElementById('pin-error').textContent = 'Remplis tous les champs.';
    return;
  }
  // Vérification PIN via un appel test sans carteId
  document.getElementById('pin-error').textContent = '';
  const btn = document.querySelector('#fidelite-pin-screen .auth-btn');
  btn.disabled = true; btn.textContent = 'Vérification…';
  const res = await fetch('/api/tampon', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pin, carteId: '__test__' })
  }).catch(() => null);
  btn.disabled = false; btn.textContent = 'Démarrer le scanner';
  if (!res) { document.getElementById('pin-error').textContent = 'Erreur réseau.'; return; }
  const json = await res.json().catch(() => ({}));
  // 404 = PIN ok mais carte inexistante (attendu), 401 = mauvais PIN
  if (res.status === 401) { document.getElementById('pin-error').textContent = 'Code PIN incorrect.'; return; }
  fidelitePin = pin;
  fideliteValidateur = validateur;
  fideliteEvent = event;
  document.getElementById('fidelite-pin-screen').style.display = 'none';
  document.getElementById('scan-event-name').textContent = event;
  document.getElementById('scan-counter').textContent = 'Mode fidélité';
  document.getElementById('scan-status').textContent = 'Scanner actif';
  document.getElementById('scanner-screen').style.display = 'block';
  await startCamera();
}

async function doLogin() {
  const email = document.getElementById('auth-email').value.trim();
  const pwd   = document.getElementById('auth-password').value;
  const btn   = document.querySelector('.auth-btn');
  document.getElementById('auth-error').textContent = '';
  btn.disabled = true; btn.textContent = 'Connexion…';
  const { error } = await Auth.sb.auth.signInWithPassword({ email, password: pwd });
  if (error) {
    document.getElementById('auth-error').textContent = 'Email ou mot de passe incorrect.';
    btn.disabled = false; btn.textContent = 'Se connecter';
    return;
  }
  document.getElementById('auth-screen').style.display = 'none';
  startScanner();
}

// ── Scanner ──
async function startScanner() {
  document.getElementById('scanner-screen').style.display = 'block';
  await loadBilletterie();
  await startCamera();
}

async function loadBilletterie() {
  if (!billetterieId) return;
  const { data: bil } = await Auth.sb.from('billetteries').select('titre').eq('id', billetterieId).single();
  if (bil) { billetterieNom = bil.titre; document.getElementById('scan-event-name').textContent = bil.titre; }
  await refreshCounter();
}

async function refreshCounter() {
  if (!billetterieId) return;
  const { data } = await Auth.sb.from('billetterie_inscriptions').select('id,statut').eq('billetterie_id', billetterieId);
  if (data) {
    totalInscrits = data.length;
    totalPresents = data.filter(r => r.statut?.toLowerCase() === 'rejoint').length;
    document.getElementById('scan-counter').textContent = `${totalPresents} / ${totalInscrits} présents`;
  }
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } });
    const video = document.getElementById('video');
    video.srcObject = stream;
    await video.play();
    scanning = true;
    requestAnimationFrame(tick);
    document.getElementById('scan-status').textContent = 'Scanner actif';
  } catch (e) {
    document.getElementById('scan-status').textContent = 'Accès caméra refusé';
  }
}

function tick() {
  if (!scanning) return;
  const video  = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  if (video.readyState !== video.HAVE_ENOUGH_DATA) { requestAnimationFrame(tick); return; }
  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const code = jsQR(imgData.data, canvas.width, canvas.height, { inversionAttempts: 'dontInvert' });
  if (code?.data) {
    scanning = false;
    handleQR(code.data);
    return;
  }
  requestAnimationFrame(tick);
}

async function handleQR(data) {
  document.getElementById('scan-status').textContent = 'QR détecté, recherche…';
  const uuid = data.trim();
  const { data: insc, error } = await Auth.sb
    .from('billetterie_inscriptions')
    .select('id,prenom,nom,tarif_nom,statut,billetterie_id')
    .eq('id', uuid)
    .single();

  if (error || !insc) {
    showPopupError('QR code inconnu ou invalide.');
    return;
  }

  currentInscription = insc;
  const initials = ((insc.prenom||'').charAt(0) + (insc.nom||'').charAt(0)).toUpperCase();
  const isPresent = insc.statut?.toLowerCase() === 'rejoint';
  const name = `${insc.prenom || ''} ${insc.nom || ''}`.trim();

  document.getElementById('popup-content').innerHTML = `
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px">
      <div style="width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#460186,#D2396D);color:white;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0">${initials}</div>
      <div>
        <div style="font-size:22px;font-weight:800;color:#1a0030;line-height:1.2">${esc(name)}</div>
        <div style="font-size:13px;color:#888;margin-top:3px">${esc(insc.tarif_nom||'—')}</div>
      </div>
    </div>
    ${isPresent ? `<div style="background:#fef9c3;border:1px solid #fde68a;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:14px;color:#92400e;font-weight:600">Déjà marqué(e) présent(e) !</div>` : ''}
    <button onclick="confirmPresence()" style="width:100%;padding:16px;background:linear-gradient(135deg,#460186,#D2396D);color:white;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;margin-bottom:10px">
      ${isPresent ? 'Marquer à nouveau présent(e)' : 'Confirmer la présence'}
    </button>
    <button onclick="closePopup()" style="width:100%;padding:14px;background:#f3f4f6;color:#374151;border:none;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer">
      Annuler
    </button>`;
  document.getElementById('scan-popup').classList.add('open');
}

function showPopupError(msg) {
  document.getElementById('popup-content').innerHTML = `
    <div style="text-align:center;padding:20px 0">
      <div style="font-size:40px;margin-bottom:12px">❌</div>
      <div style="font-size:16px;font-weight:700;color:#dc2626;margin-bottom:4px">QR invalide</div>
      <div style="font-size:14px;color:#888">${msg}</div>
    </div>
    <button onclick="closePopup()" style="width:100%;padding:14px;background:#f3f4f6;color:#374151;border:none;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer">
      Fermer
    </button>`;
  document.getElementById('scan-popup').classList.add('open');
}

async function confirmPresence() {
  if (!currentInscription) return;
  const { error } = await Auth.sb
    .from('billetterie_inscriptions')
    .update({ statut: 'rejoint' })
    .eq('id', currentInscription.id);
  if (error) { alert('Erreur : ' + error.message); return; }
  const name = `${currentInscription.prenom||''} ${currentInscription.nom||''}`.trim();
  document.getElementById('scan-popup').classList.remove('open');
  showFlash(name);
  totalPresents++;
  document.getElementById('scan-counter').textContent = `${totalPresents} / ${totalInscrits} présents`;
  currentInscription = null;
  setTimeout(() => { scanning = true; requestAnimationFrame(tick); }, 1200);
  document.getElementById('scan-status').textContent = 'Scanner actif';
}

function closePopup() {
  document.getElementById('scan-popup').classList.remove('open');
  currentInscription = null;
  setTimeout(() => { scanning = true; requestAnimationFrame(tick); document.getElementById('scan-status').textContent = 'Scanner actif'; }, 300);
}

function showFlash(name) {
  const el = document.getElementById('flash');
  document.getElementById('flash-name').textContent = name;
  el.style.background = 'rgba(22,163,74,.85)';
  el.classList.add('show');
  setTimeout(() => { el.classList.remove('show'); el.classList.add('hide'); setTimeout(() => { el.classList.remove('hide'); }, 700); }, 1000);
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c));
}

init();
</script>
</body>
</html>
